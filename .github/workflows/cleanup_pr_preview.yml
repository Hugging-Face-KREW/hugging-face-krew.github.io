name: PR Preview Cleanup

on:
  pull_request_target:
    branches:
      - main
    types:
      - closed

concurrency:
  group: pr-preview-${{ github.event.pull_request.head.repo.id }}-${{ github.event.pull_request.head.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  cleanup-preview:
    # This workflow intentionally uses pull_request_target only for trusted
    # preview cleanup. Do not checkout or execute pull request head code here.
    if: github.event.pull_request.base.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout trusted base branch
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Remove PR preview
        uses: rossjrw/pr-preview-action@v1
        with:
          preview-branch: gh-pages
          umbrella-dir: pr-preview
          pages-base-url: hugging-face-krew.github.io
          pr-number: ${{ github.event.pull_request.number }}
          action: remove
          wait-for-pages-deployment: false
          qr-code: false
